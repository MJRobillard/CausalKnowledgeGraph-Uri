# Document registry: trust metadata assigned by hand, once per document.
# `file` is relative to data/sources/; `url` is where the file was downloaded from.
# `redistribute: false` marks third-party copyrighted documents that are kept out of git; get them with
# scripts/fetch_sources.py, which checks each against `sha256`.
# `scope` is the document-level default passed to the extractor so that a
# sentence like "fuel issues caused 31.4%" inherits the report's region and window.

