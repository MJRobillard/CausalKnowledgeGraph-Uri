  - id: ferc_final_2021_11
    file: federal/FERC_NERC_Feb2021_Cold_Weather_Final_Report_2021-11.pdf
    url: https://www.nerc.com/pa/rrm/ea/Documents/February_2021_Cold_Weather_Report.pdf
    publisher: FERC, NERC and Regional Entities staff
    publisher_role: regulator
    doc_type: final_report
    published_at: 2021-11-16
    first_party: false
    flags: []
    scope: {region: "ERCOT+SPP+MISO", window: ["2021-02-08", "2021-02-20"],
            cause_scheme: ferc_nerc_2021_11, cause_metric_default: share_of_events}

