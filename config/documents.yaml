  - id: noaa_zone_temp_hourly
    file: ../external/noaa/ercot_zone_temp_hourly_utc_F_2021-02-01_26.csv
    publisher: NOAA NCEI (global-hourly, one station per ERCOT weather zone)
    publisher_role: government_data
    doc_type: dataset
    measured: true
    exogenous: true
    first_party: false
    flags: []
    version: "downloaded 2026-11-14 (2/1-21); 2/22-26 added 2026-11-15 by scripts/extend_zone_temps.py"
    published_at: 2026-11-14
    resolution: hour
    clock: "UTC, hour-start labels (T4); converted to Central in kg/series.py"
    variables: [Coast, East, Far West, North, North Central, South Central, South Central (extra), Southern, West]
    unit: degF
    scope: {region: "ERCOT weather zones", window: ["2021-02-01", "2021-02-26"]}

